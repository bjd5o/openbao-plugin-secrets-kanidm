name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make integration
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration/.state/*.log

  targets:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - id: targets
        run: make ci-targets >> "$GITHUB_OUTPUT"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [unit, integration, targets]
    strategy:
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-target TARGET=${{ matrix.target }} VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: bin/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: plugin-*
          merge-multiple: true
      - run: make -j"$(nproc)" release VERSION=${{ github.ref_name }}
        env:
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Signed archives, checksums, and SBOMs are attached. The image digest is added after the image push."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$notes"
          fi

  push-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y buildah
      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: plugin-*
          merge-multiple: true
      - id: push
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          make push VERSION="$GITHUB_REF_NAME" IMAGE="$image" SOURCE="https://github.com/${GITHUB_REPOSITORY}"
          digest="$(tr -d '[:space:]' < dist/image-digest.txt)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Plugin image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image:$GITHUB_REF_NAME@$digest\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [release, push-image]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Record the image digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.push-image.outputs.image }}
          DIGEST: ${{ needs.push-image.outputs.digest }}
        run: |
          ref="$IMAGE:$GITHUB_REF_NAME@$DIGEST"
          visibility="The package is private because this repository is private."
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            name="${GITHUB_REPOSITORY#*/}"
            name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            if gh api --method PUT -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${name}/visibility" -f visibility=public; then
              visibility="The package is public."
            else
              visibility="The package was created private. Set it to public on the package page so OpenBao can pull it without credentials."
            fi
          fi
          cat > notes.md <<EOF
          ## Install

              plugin_directory = "/openbao/plugins"
              plugin_auto_download = true

              plugin "secret" "kanidm" {
                image = "${ref}"
              }

          Signed archives, checksums.txt, and CycloneDX SBOMs are attached.

          ${visibility}
          EOF
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
